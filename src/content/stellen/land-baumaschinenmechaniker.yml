einleitung: Wir sind ein kleines und im Markt etabliertes Unternehmen für Spezialfahrzeuge auf Schiene und Strasse seit 1968 und Generalvertretung der ZAGRO Group. Zur Verstärkung unseres Teams suchen wir eine qualifizierte Fachperson.
aufgaben:
- Herstellung und Aufbau unserer weltweit einzigartigen Eigenprodukte
- Elektrische, elektronische und mechanische Reparaturen
- Wartung und Modifikationen an Fahrzeugen, Systemen und Geräten
- Parametrieren und Einstellen von elektronischen Baugruppen
- Inbetriebnahme, Unterhaltsarbeiten und Störungsbehebung bei Kunden
- Arbeiten an Geräten von Palfinger Railway, Europower, Unimog, ZAGRO, ZWEIWEG u. v. m.
- Unterstützung bei technischen Abnahmen und Störungsbehebungen
anforderungen:
- Technische Ausbildung als Land- oder Baumaschinenmechaniker
- Erfahrung in Hydraulik und Elektrik
- Montage- und Serviceerfahrung
- Selbständige, exakte und systematische Arbeitsweise
- Zuverlässigkeit und hohes Verantwortungsbewusstsein
- Kenntnisse im Maschinenbau mit Hydraulik- und Pneumatik-Aggregaten von Vorteil
- Führerausweis Kategorie B, evtl. C
wir_bieten:
- Eine abwechslungsreiche, interessante Arbeitsstelle
- Eine gut ausgestattete Werkstatt
- Ein gut eingerichtetes Servicefahrzeug
- Einen leistungs- und zeitgerechten Lohn
