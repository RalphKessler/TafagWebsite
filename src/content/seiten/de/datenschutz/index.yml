titel: Datenschutzerklärung
beschreibung: Wie die Tafag AG mit Personendaten umgeht (DSG).
bloecke:
- type: text
  inhalt: |
    ## 1. Verantwortliche Stelle

    Tafag AG, Chräbelstrasse 3, 6410 Goldau, Schweiz, info@tafag.ch, +41 41 859 08 20.
    Diese Datenschutzerklärung richtet sich nach dem Schweizer Datenschutzgesetz (DSG, in Kraft seit 1. September 2023).

    ## 2. Aufruf der Website

    TODO: Hosting-Anbieter bestätigen (Vorlage: Hostpoint AG, Schweiz).

    Beim Aufruf der Website speichert der Server technisch notwendige Angaben (IP-Adresse, Datum und Uhrzeit,
    aufgerufene Seite, Browser) in Protokolldateien. Diese dienen dem sicheren Betrieb und werden nach kurzer Zeit gelöscht.

    Wir verwenden **keine Cookies zu Analyse- oder Werbezwecken**, keine Tracking-Dienste und
    laden keine Schriften, Karten oder Skripte von Drittanbietern.

    ## 3. Formulare und E-Mail

    Wenn Sie uns über ein Formular (z. B. Kontakt, Anfrage, Serviceanfrage, Bewerbung) oder per E-Mail
    kontaktieren, bearbeiten wir Ihre Angaben und mitgesendeten Dateien ausschliesslich zur Bearbeitung
    Ihres Anliegens. Die Daten werden auf dem Server gespeichert und per E-Mail an uns weitergeleitet.

    Serviceanfragen erfassen wir als Ticket in unserem Ticketsystem (support.tafag.ch), damit wir sie nachverfolgen können.

    Bewerbungen samt Unterlagen löschen wir auf dem Server automatisch nach 180 Tagen. Übrige Anfragen
    löschen wir, sobald sie nicht mehr benötigt werden und keine gesetzlichen Aufbewahrungspflichten bestehen.

    ## 4. Links zu anderen Websites

    Die Website enthält Links, zum Beispiel zu Partnern oder Google Maps. Erst wenn Sie einen solchen Link
    anklicken, gelangen Sie zum jeweiligen Anbieter; dort gelten dessen Datenschutzbestimmungen.

    ## 5. Videos (YouTube, Vimeo)

    Falls wir Videos einbetten, werden diese **erst geladen, wenn Sie auf «Video abspielen» klicken**. Erst dann
    werden Daten (u. a. Ihre IP-Adresse) an den jeweiligen Anbieter übermittelt, unter Umständen
    auch in die USA. Bei YouTube verwenden wir den erweiterten Datenschutzmodus (youtube-nocookie.com).

    ## 6. Ihre Rechte

    Sie haben das Recht auf Auskunft über Ihre Personendaten, auf Berichtigung und Löschung sowie
    auf Herausgabe. Wenden Sie sich dazu an info@tafag.ch.

    ## 7. Änderungen

    Wir können diese Datenschutzerklärung jederzeit anpassen. Es gilt die auf dieser Website
    veröffentlichte Fassung.

    Stand: Oktober 2026
