titel: Arbeiten bei TAFAG
beschreibung: 'Arbeiten bei der Tafag AG: Spezialfahrzeuge für Schiene und Strasse, gut ausgestattete Werkstatt, abwechslungsreiche Aufgaben.'
einleitung: Herstellung, Service und Weiterentwicklung von Spezialfahrzeugen – in einem kleinen Team mit grosser Eigenverantwortung.
