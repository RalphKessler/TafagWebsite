titel: Service und Inbetriebnahme
beschreibung: Aufbau und Test im eigenen Werk, Schulung, Dokumentation, Service und Ersatzteile – Tafag AG, Goldau.
einleitung: Nur sorgfältig fertiggestellte und erfolgreich getestete Systeme verlassen unser Werk.
bloecke:
- type: bildtext
  titel: Im eigenen Werk aufgebaut und getestet
  inhalt: |
    Die Tafag AG legt grossen Wert darauf, ihre Fahrzeuge, Speziallösungen und Anlagen wann immer möglich im eigenen Werk vollständig aufzubauen und in Betrieb zu setzen. Erst danach werden sie zum Kunden transportiert und dort wieder aufgebaut.
  bild: /uploads/fahrzeuge/vtms-kran.webp
  alt: VTms mit Kran und Tragwagen auf einem Abstellgleis
