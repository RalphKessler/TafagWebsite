    text: Ausführliche Dokumentation zu jedem Fahrzeug und jeder Anlage.
  - titel: Schulung
    text: Intensive Schulungen, wahlweise bei uns im Werk oder vor Ort.
  - titel: Beratung, Service und Ersatzteile
    text: Kompetente Unterstützung über die ganze, lange Lebensdauer Ihrer Betriebsmittel.
  - titel: Service vor Ort
    text: Kundendienstmitarbeitende mit komplett ausgerüsteten Servicefahrzeugen.
  - titel: Unterhalts-Container
    text: Auf grösseren Baustellen bis Projektende vor Ort im Einsatz.
