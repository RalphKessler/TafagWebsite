titel: ZAGRO E-MAXI L
gruppe: rangiergeraete
kategorie: ZAGRO Programm
kurz: Elektrorangierer für Anhängelasten bis 350 t, auch mit EBO-Zulassung.
beschreibung: |
  Aus dem Programm der ZAGRO Group – Angaben gemäss Hersteller. Die Tafag AG ist Generalvertretung der ZAGRO Group und berät Sie zur passenden Ausführung für Ihren Einsatz.

  ### Vorteile der E-MAXI-Baureihe

  - Für freiliegende und niveauebene Gleisanlagen
  - Stufenlos regelbarer Elektroantrieb, zweistufig umschaltbare Geschwindigkeit: 0–3 km/h, 0–6 km/h
  - Emissionsfrei – ideal für geschlossene Räume
  - Wenden auf der Stelle durch Allradlenkung
  - Einfaches Ankuppeln an der Stirnseite des Waggons, Rangieren in beide Fahrtrichtungen ohne Umsetzen
  - Funkfernsteuerung auf Strasse und Schiene, Fahrzeugüberwachung und Remote-Service
