titel: ZAGRO E-MAXI XL WBA
gruppe: rangiergeraete
kategorie: Standardgerät Schweiz
kurz: Mit Waggon-Bremsanlage und durchgehenden Schienenachsen für Anhängelasten bis 800 t – Standardgerät in Schweizer Ausführung.
beschreibung: |
  Der ZAGRO E-MAXI XL WBA ist ein batterieelektrischer Rangierer für das effiziente Bewegen von Schienenfahrzeugen. Dank Vierradantrieb und patentierter Allradlenkung eignet er sich besonders für Rangierarbeiten auf engem Raum.

  Ausgestattet mit einer Waggon-Bremsanlage (WBA) und durchgehenden Schienenachsen, kann er für Anhängelasten von bis zu 800 Tonnen eingesetzt werden.

  Eines von drei Standardgeräten, die die Tafag AG als Generalvertretung der ZAGRO Group in Schweizer Ausführung anbietet. Das Datenblatt mit allen Angaben steht unten zum Download bereit.
