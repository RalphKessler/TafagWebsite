technische_daten:
- name: Antriebsart
  wert: batterieelektrisch
- name: Max. Anhängelast
  wert: 800 t in der Ebene und bei trockenen Verhältnissen
- name: Zugkraft am Haken
  wert: ca. 35 kN
- name: Abmessungen (L × B × H)
  wert: ca. 5800 × 2240 × 2200 mm
- name: Eigengewicht
  wert: ca. 15 t
- name: Spurweiten
  wert: Normalspur 1435 mm, Meterspur 1000 mm
- name: Schienenfahreinrichtung
  wert: Hydraulisch heb- und senkbare Schienenachse vorne und hinten, Betätigung über Funkfernsteuerung
- name: Antrieb
  wert: Vierradantrieb über Vulkollanräder, je ein Elektromotor à 7,5 kW pro Antriebsrad
- name: Lenkung
  wert: 'Reifenschonende Allradlenkung: Die vier Antriebsräder lassen sich per Joystick auf der Funkfernsteuerung um bis zu 130° schwenken. Je nach Modell: Drehen auf der Stelle und Diagonalfahrt, optional Sternfahrt sowie separate Vorder- oder Hinterradlenkung.'
- name: Batterie
  wert: 80 V / 875 Ah; Blei-Säure-Batterie mit integrierter Aquamatik zum Nachfüllen des Batteriewassers; Ladegerät mit Anschlussdose CEE 400 V/16 A fest im Fahrzeug verbaut
- name: Bremse
  wert: Waggon-Bremsanlage (WBA)
- name: Geschwindigkeit ohne Last
  wert: 0 bis max. 6 km/h, proportional regelbar über Funkfernsteuerung
- name: Geschwindigkeit mit Last
  wert: 0 bis max. 3 km/h, proportional regelbar über Funkfernsteuerung; Wahl zwischen Fahrt mit Last und Leerfahrt über abziehbaren Schlüssel auf der Funkfernsteuerung
- name: Steuerung
  wert: Funkfernsteuerung mit proportionalen Joysticks für Lenkung, Fahrgeschwindigkeit und Bremse; Zweihandbedienung für sicherheitsrelevante Aktionen (z. B. Schienenachsen heben/senken, Waggon-Bremsanlage aktivieren, optionale automatische Kupplung öffnen)
