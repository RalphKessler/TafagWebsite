titel: ZAGRO E-MAXI M
gruppe: rangierfahrzeuge
kategorie: Elektrorangierer – Standard Schweiz
kurz: Kompakter, batterieelektrischer Rangierer für Anhängelasten bis 200 t – Standardgerät in Schweizer Ausführung.
beschreibung: |
  Der ZAGRO E-MAXI M ist ein kompakter, batterieelektrischer Rangierer für das effiziente Bewegen von Schienenfahrzeugen. Dank Vierradantrieb und patentierter Allradlenkung eignet er sich besonders für Rangierarbeiten auf engem Raum und kann für Anhängelasten von bis zu 200 Tonnen eingesetzt werden.

  Eines von drei Standardgeräten, die die Tafag AG als Generalvertretung der ZAGRO Group in Schweizer Ausführung anbietet. Das Datenblatt mit allen Angaben steht unten zum Download bereit.
