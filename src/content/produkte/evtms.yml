titel: eVTms – selbstfahrendes Arbeitsfahrzeug
gruppe: evtms
kategorie: Schienenfahrzeug
kurz: Diesel-elektrisch mit Partikelfilter, mm-genau positionierbar, im Güterverkehr mit 100 km/h unterwegs – das Arbeitsfahrzeug für Fahrleitung, Gleis und Tunnel.
beschreibung: |
  Die Bahninfrastruktur erfordert zahlreiche Hilfsmittel für die Unterhaltsaufgaben rund um Fahrleitungen, Gleisanlagen und Tunnel-Installationen. Rationelle, moderne Hilfsmittel steigern Qualität und Effizienz dieser Arbeit – die Tafag AG ist Ihr Partner für VTms (selbstfahrende Arbeitsfahrzeuge).

  Diesel-elektrisch angetrieben und mit Partikelfilter ausgerüstet, ist das VTms ein ideales Hilfsmittel für Arbeiten im Tunnel. Unsere Fahrzeuge waren im Lötschberg- und im Gotthard-Basistunnel für die Vor- und Fertigmontage im Dauereinsatz.

  ### Antrieb

  Der elektromechanische Antrieb ist das Herzstück. Jede Arbeitsposition kann aus dem Führerhaus oder von der Arbeitsplattform aus millimetergenau angefahren werden. Die Strecke zum Einsatzort fährt das VTms im regulären Güterverkehr mit 100 km/h.

  ### Ausrüsten mit Twistlock

  Dazu erhältlich sind zahlreiche, nach Ihren Wünschen ausgestattete, wechselbare Plattformen mit Unterhaltshilfsmitteln wie Kranen, Arbeitsbühnen, Kabelverlegeeinrichtungen oder Inspektionsausrüstungen – siehe [Module](/de/produkte/module/) und [Hebebühne / Kran](/de/produkte/hebebuehne-kran/).
