titel: ZWEIWEG Oberleitungsmontagefahrzeug auf Unimog-Basis
gruppe: zweiweg
kategorie: Unimog
kurz: Der Unimog mit Schienenführungseinrichtung und Teleskop-, Scheren- oder Gelenkbühne – das Arbeitsfahrzeug für die Oberleitung.
beschreibung: |
  Die Tafag AG ist Ihr Partner für Zweiwegefahrzeuge. Ob Pickup, Transporter, Unimog, Baumaschine oder LKW aller Gewichtsklassen – wir bringen sie auf die Schiene. Wir projektieren für Sie die optimale Lösung und kombinieren Basisfahrzeug, Aufbau, Arbeitsgerät und Schienenfahreinrichtung zu einer massgeschneiderten Einheit mit allen erforderlichen Zulassungen.

  ### Schienenführung

  Das Zweiwegefahrzeug fährt mit seinen Strassenrädern auf der Schiene und wird durch die Schienenräder sicher in der Spur geführt. Antrieb und Bremsen erfolgen über die Strassenräder. Für jeden Fahrzeugtyp, jede Spurweite, jeden Kurvenradius und jede Geschwindigkeit haben wir die passende Schienenführung.

  ### Schienenfahreinrichtung

  Kann oder darf das Fahrzeug mit seinen Strassenrädern nicht auf der Schienenspur fahren, kommt eine Schienenfahreinrichtung zum Einsatz. Das Fahrzeug wird angehoben und steht ausschliesslich auf den Schienenrädern; Antrieb und Bremsen erfolgen über die Schienenräder.

  Für eine lange Lebensdauer Ihres Fahrzeugs steht Ihnen unser Kundenservice zur Verfügung – ein Fahrzeugleben lang.
