titel: ZAGRO E-MAXI M WBA
gruppe: rangiergeraete
kategorie: Standardgerät Schweiz
kurz: Mit Waggon-Bremsanlage und Zusatzballast für Anhängelasten bis 300 t – Standardgerät in Schweizer Ausführung.
beschreibung: |
  Der ZAGRO E-MAXI M WBA ist ein kompakter, batterieelektrischer Rangierer für das effiziente Bewegen von Schienenfahrzeugen. Dank Vierradantrieb und patentierter Allradlenkung eignet er sich besonders für Rangierarbeiten auf engem Raum.

  Ausgestattet mit einer Waggon-Bremsanlage (WBA) und zusätzlichem Ballastgewicht für eine höhere Anpresskraft der Antriebsräder, kann er für Anhängelasten von bis zu 300 Tonnen eingesetzt werden.

  Eines von drei Standardgeräten, die die Tafag AG als Generalvertretung der ZAGRO Group in Schweizer Ausführung anbietet. Das Datenblatt mit allen Angaben steht unten zum Download bereit.
