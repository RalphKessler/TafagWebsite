beschreibung: |
  «Unmöglich» ist für die Tafag AG ein Fremdwort. Dank langjähriger Erfahrung finden wir zusammen mit unseren Kunden eine Lösung für jede noch so komplexe Herausforderung. Diese Spezialgebiete haben wir in den letzten Jahren am intensivsten bearbeitet:

  - Hub- und Senkanlagen
  - Spezialarbeitsbühnen
  - Krananlagen
  - Handlinggeräte
  - Twistlock-Systeme

  ### Spezialarbeitsbühne

  Beide Arbeitsplattformen können unabhängig voneinander bedient werden. Sie bieten einen Seitenhub von 2150 mm und eine Höhe bis 7265 mm. Kombiniert mit dem VTms ist dies ein ideales Gefährt für die Bahninfrastruktur.

  Gerne machen wir auch für Ihre Aufgabenstellung einen Lösungsvorschlag – unabhängig davon, aus welchem Anwendungsgebiet sie stammt. Ein Beispiel: der [Installationszug Gotthard-Basistunnel](/de/referenzen/installationszug-gotthard/).
